name: Seed repository from upstream REA

on:
  push:
    paths:
      - ".github/workflows/seed-mirror.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream repository and push its branches and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --bare https://github.com/morluto/rea.git /tmp/rea.git
          DESTINATION="https://x-access-token:${GH_TOKEN}@github.com/kadiwalarman1-rgb/reverse-engineering-.git"
          git -C /tmp/rea.git push --force "${DESTINATION}" 'refs/heads/*:refs/heads/*'
          git -C /tmp/rea.git push --force "${DESTINATION}" 'refs/tags/*:refs/tags/*'
