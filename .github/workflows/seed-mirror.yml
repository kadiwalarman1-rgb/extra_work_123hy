name: Build and publish ChatWave APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seed-mirror.yml"

permissions:
  contents: write

jobs:
  build-chatwave:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found on the runner." >&2
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -n 10 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download and verify Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output gradle-8.9-bin.zip "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  gradle-8.9-bin.zip" | sha256sum --check --strict
          unzip -q gradle-8.9-bin.zip

      - name: Build ChatWave debug APK
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" -p android-chatwave assembleDebug --no-daemon --stacktrace
          cp android-chatwave/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ChatWave-v1.0.0.apk"
          sha256sum "$RUNNER_TEMP/ChatWave-v1.0.0.apk"
          stat -c 'ChatWave APK size: %s bytes' "$RUNNER_TEMP/ChatWave-v1.0.0.apk"

      - name: Publish ChatWave APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="chatwave-v1.0.0"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/ChatWave-v1.0.0.apk" --repo "$REPO" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/ChatWave-v1.0.0.apk" --repo "$REPO" --target main --title "ChatWave Android APK v1.0.0" --notes "Original local-device Android messaging prototype. Includes chat search, local conversations, emoji reactions, pinned chats and messages, dark mode, accent colors, and local attachment selection. No online accounts, cloud sync, remote message delivery, or cloud file upload are connected. Not Telegram; does not bypass Telegram Premium."
          fi
